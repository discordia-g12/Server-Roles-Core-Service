name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Un push nuevo a un PR cancela el run anterior del mismo PR. Cada push a main/develop tiene su propio grupo
# (el run_id): nunca se cancela ni se descarta uno que publica una imagen o despliega.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -r app -ll

      - name: Run migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_USER: admin
          DATABASE_PASSWORD: password
          DATABASE_NAME: db
        run: alembic upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_HOST: localhost
          DATABASE_USER: admin
          DATABASE_PASSWORD: password
          DATABASE_NAME: db
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker:
    # Construye la imagen y la publica en GHCR con el SHA del commit (lo que se despliega) y el nombre de la
    # rama. Sin "latest". Solo en push a main/develop: en los PRs no corre, para no gastar un build por cada
    # push (el Dockerfile se valida al mergear a develop). La excepción son los PRs de Dependabot que cambian
    # la imagen base: se construyen (sin publicar) antes de mergear.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'dependabot/docker/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/discordia-g12/server-roles-service
      PUSH: ${{ github.event_name == 'push' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # evita el límite de descargas anónimas de Docker Hub (imágenes base)
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build (and push on main/develop)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo en push a main, con la imagen ya en GHCR: el workflow del orquestador la despliega en el nodo edge
  # por SSM y falla si no queda healthy (en ese caso el nodo vuelve solo al tag anterior).
  # También reinicia server-roles-outbox-worker, que usa la misma imagen.
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: discordia-g12/discordia-orchestrator/.github/workflows/deploy.yml@main
    with:
      service: server-roles-service
      node: edge
      sha: ${{ github.sha }}
