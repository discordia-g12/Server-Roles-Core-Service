services:
  db:
    image: postgres:16-alpine
    container_name: discordia_server_core_db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: discordia_server_core_app
    volumes:
      - .:/app
    command: >
      bash -c "alembic upgrade head && 
               uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    ports:
      - "8080"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_HOST=db
      - DATABASE_NAME=db
      - DATABASE_PORT=5432
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy